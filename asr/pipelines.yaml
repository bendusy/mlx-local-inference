meeting:
  diarize:
    # FastClustering threshold — higher value = MORE conservative merge =
    # MORE clusters. 0.5 over-segments severely on 30+ min multilingual
    # meetings (observed 129 clusters where ground truth had 10).
    # Lower to 0.3 for fewer-but-coarser speaker buckets.
    cluster_threshold: 0.3
    # Force exact cluster count by setting num_clusters > 0; otherwise the
    # threshold path is used. If you know how many speakers the meeting
    # has, this is the most reliable knob.
    num_clusters: -1
    min_duration_on: 0.3
    min_duration_off: 0.5
  transcribe:
    backend: sense_voice
    chunk_max_sec: 30
    # Skip diarized chunks shorter than this (filler / sliver artifacts).
    min_segment_sec: 0.2
    # Post-transcribe merge of adjacent same-speaker chunks. Cuts the
    # number of items the LLM reviewer has to process. Big lever — on
    # the 36-min test we observed 362 segments for 10 real speakers,
    # most of which were sub-second slivers from over-segmentation.
    # Merging them by speaker continuity reduces review batches roughly
    # 2-3× without losing any text.
    merge:
      enabled: true
      max_gap_sec: 2.0
      max_merged_sec: 60.0
  review:
    # Qwen3.5-9B is 3-4× faster per gemma-4-26b call on this hardware
    # and is sufficient for structured JSON correction tasks. Switch to
    # gemma-4-26b-a4b-it-4bit if the 9B is making consistent quality
    # mistakes on a specific corpus.
    model: Qwen3.5-9B-MLX-4bit
    context_window_segments: 4
    # Smaller batches recover faster from a single bad gemma-4 response
    # and reduce per-call latency variance. Empirically 8 is a good balance
    # between throughput (fewer calls) and resilience (smaller blast radius).
    max_segments_per_call: 8
    # Per-call HTTP timeout in seconds. gemma-4-26b on this hardware needs
    # ~30-90s per batch; 180s gives generous headroom without hanging
    # forever on a single stuck call.
    timeout_sec: 180
    # Wave-parallel review: process N batches concurrently per wave.
    # oMLX is configured for max_concurrent_requests=8 (see ~/.omlx/settings.json),
    # so 4 is a safe default that leaves headroom for IM-mode traffic.
    # Set to 1 for strictly sequential review (preserves the full sliding
    # context window between every batch). Higher values trade some
    # cross-batch context continuity for ~N× speedup on the review phase
    # (the dominant cost in the meeting pipeline).
    parallel_batches: 4
  summary:
    # Summary is a one-shot call where the prompt is the full transcript;
    # 26b is worth the extra cost for higher-quality structured output.
    model: gemma-4-26b-a4b-it-4bit
    timeout_sec: 120
