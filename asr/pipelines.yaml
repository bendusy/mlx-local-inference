meeting:
  diarize:
    # FastClustering threshold semantics (empirically verified on this stack,
    # NOT what the original docs implied):
    #   higher threshold → fewer clusters (more aggressive merging)
    #   lower threshold  → more clusters (more aggressive splitting)
    # Earlier wrong choice of 0.3 produced 235 clusters on a 36-min meeting
    # (GT = 10 speakers); 0.5 produced 129; 0.7 should compress further.
    # If you know the meeting size, set num_clusters > 0 instead.
    cluster_threshold: 0.7
    # Force exact cluster count by setting num_clusters > 0; otherwise the
    # threshold path is used. If you know how many speakers the meeting
    # has, this is the most reliable knob.
    num_clusters: -1
    min_duration_on: 0.3
    min_duration_off: 0.5
  transcribe:
    backend: sense_voice
    chunk_max_sec: 30
    # Skip diarized chunks shorter than this (filler / sliver artifacts).
    min_segment_sec: 0.2
    # Post-transcribe merge of adjacent same-speaker chunks. Cuts the
    # number of items the LLM reviewer has to process. Big lever — on
    # the 36-min test we observed 362 segments for 10 real speakers,
    # most of which were sub-second slivers from over-segmentation.
    # Merging them by speaker continuity reduces review batches roughly
    # 2-3× without losing any text.
    merge:
      enabled: true
      max_gap_sec: 2.0
      max_merged_sec: 60.0
  review:
    # Live test (job 44c94074b746) showed Qwen3.5-9B is faster per call
    # but produces 18× FEWER context-aware corrections than gemma-4-26b
    # on the same audio (12 vs 222 modified segments) — quality regression
    # too large to accept. Stick with gemma-4-26b-a4b-it-4bit; rely on
    # the same-speaker merge below to cut total batch count instead.
    model: gemma-4-26b-a4b-it-4bit
    context_window_segments: 4
    # Smaller batches recover faster from a single bad gemma-4 response
    # and reduce per-call latency variance. Empirically 8 is a good balance
    # between throughput (fewer calls) and resilience (smaller blast radius).
    max_segments_per_call: 8
    # Per-call HTTP timeout in seconds. gemma-4-26b on this hardware needs
    # ~30-90s per batch; 180s gives generous headroom without hanging
    # forever on a single stuck call.
    timeout_sec: 180
    # Wave-parallel review: process N batches concurrently per wave.
    # Live tests showed oMLX SERIALIZES chat completions internally (single
    # GPU stream) regardless of HTTP concurrency, so values >1 don't actually
    # speed up review — they just queue more work AND increase memory
    # pressure on the host (multiple in-flight prompts held in RAM, plus
    # the asr-router's own SenseVoice/diarize models still resident).
    # Default 1 = strictly sequential, full sliding context preserved,
    # lowest concurrent-memory footprint. Bump only if you swap oMLX for
    # an LLM backend that actually does batched inference (vLLM/Ollama).
    parallel_batches: 1
  summary:
    # Summary is a one-shot call where the prompt is the full transcript;
    # 26b is worth the extra cost for higher-quality structured output.
    model: gemma-4-26b-a4b-it-4bit
    timeout_sec: 120
